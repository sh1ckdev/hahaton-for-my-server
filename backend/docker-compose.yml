services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rational-assistant-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    networks:
      - rational-assistant-network
    volumes:
      - ./src:/app/src
      - /app/node_modules

networks:
  rational-assistant-network:
    driver: bridge

