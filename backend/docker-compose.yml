version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rational-assistant-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: rational_assistant
    volumes:
      - mongodb_data:/data/db
    networks:
      - rational-assistant-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rational-assistant-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI}}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    depends_on:
      - mongodb
    networks:
      - rational-assistant-network
    volumes:
      - ./src:/app/src
      - /app/node_modules

volumes:
  mongodb_data:
    driver: local

networks:
  rational-assistant-network:
    driver: bridge

