version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rational-assistant-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - rational-assistant-network
    # Если нужно подключиться к бэкенду, раскомментируйте:
    # depends_on:
    #   - backend

networks:
  rational-assistant-network:
    driver: bridge
    # Если бэкенд в отдельном docker-compose, используйте external network:
    # external: true

