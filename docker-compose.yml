version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - INTERNAL_PORT=${INTERNAL_PORT:-3000}
    container_name: rational-assistant-frontend
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-3001}:${INTERNAL_PORT:-3000}"
    environment:
      - INTERNAL_PORT=${INTERNAL_PORT:-3000}
    networks:
      - rational-assistant-network

networks:
  rational-assistant-network:
    driver: bridge

