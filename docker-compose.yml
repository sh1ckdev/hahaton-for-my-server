version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - INTERNAL_PORT=${INTERNAL_PORT}
        - VITE_API_URL=${VITE_API_URL}
    container_name: rational-assistant-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${EXTERNAL_PORT}:${INTERNAL_PORT}"
    environment:
      - INTERNAL_PORT=${INTERNAL_PORT}
      - VITE_API_URL=${VITE_API_URL}
    networks:
      - rational-assistant-network

networks:
  rational-assistant-network:
    driver: bridge

